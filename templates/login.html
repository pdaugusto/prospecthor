<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — ProspecTHOR</title>
    <style>
        :root {
            --bg: #05070b;
            --card: #0a0e17;
            --border: #1a2233;
            --text: #e8eef7;
            --muted: #7a8ba3;
            --neon: #00d4ff;
            --neon-dim: rgba(0, 212, 255, 0.12);
            --danger: #ff4d6a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 212, 255, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0, 100, 200, 0.06), transparent);
        }
        .wrap { width: 100%; max-width: 400px; padding: 24px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.04), 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 24px; right: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            box-shadow: 0 0 12px var(--neon);
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text);
        }
        .brand h1 span { color: var(--neon); text-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
        .brand p {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .field { margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #070b12;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 0 3px var(--neon-dim);
        }
        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            background: var(--neon);
            color: #031018;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
        }
        .btn:hover { box-shadow: 0 0 28px rgba(0, 212, 255, 0.4); }
        .btn:active { transform: scale(0.99); }
        .error {
            background: rgba(255, 77, 106, 0.08);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="brand">
                <h1>Prospec<span>THOR</span></h1>
                <p>Painel de prospecção de leads</p>
            </div>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form action="/login" method="POST">
                <div class="field">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Seu usuário" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
