<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — ProspecTHOR</title>
  <meta name="description" content="Acesse sua conta ProspecTHOR." />
  <meta name="theme-color" content="#05070b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05070b;
      --card: #0c111a;
      --border: #1a2233;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --muted-2: #5a6b82;
      --neon: #00d4ff;
      --neon-dim: rgba(0, 212, 255, 0.12);
      --danger: #ff4d6a;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 50% 40% at 50% 0%, rgba(0,212,255,0.1), transparent 55%),
        radial-gradient(ellipse 35% 30% at 90% 80%, rgba(245,197,66,0.05), transparent 50%),
        var(--bg);
    }
    .bg::after {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 30%, #000 15%, transparent 72%);
      opacity: 0.8;
    }

    .wrap {
      position: relative; z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 32px;
      width: 100%;
    }

    /* Marca = mesma do painel */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(145deg, #00d4ff 0%, #0a6fa8 100%);
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px rgba(0,212,255,0.28), 0 0 20px rgba(0,212,255,0.28), inset 0 1px 0 rgba(255,255,255,0.28);
      overflow: hidden;
    }
    .brand-mark img {
      width: 26px; height: 26px;
      display: block; object-fit: contain;
    }
    .brand-word {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      white-space: nowrap;
      line-height: 1.2;
    }
    .brand-word span {
      color: var(--neon);
      text-shadow: 0 0 16px rgba(0,212,255,0.35);
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px 26px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(165deg, rgba(14,18,28,0.98), rgba(8,10,16,0.99));
      box-shadow:
        0 0 0 1px rgba(0,212,255,0.04),
        0 24px 50px rgba(0,0,0,0.45);
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 22px; right: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.65), transparent);
    }

    .card-ico {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: grid; place-items: center;
      margin-bottom: 16px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.18);
      color: var(--neon);
    }
    .card-ico svg { width: 22px; height: 22px; }

    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .error {
      background: rgba(255, 77, 106, 0.08);
      border: 1px solid rgba(255, 77, 106, 0.35);
      color: #ff8fa3;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      background: #070b12;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-family: var(--font);
      font-weight: 500;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--muted-2); font-weight: 400; }
    input:focus {
      border-color: rgba(0,212,255,0.55);
      box-shadow: 0 0 0 3px var(--neon-dim);
    }

    .btn-enter {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 800;
      font-family: var(--font);
      cursor: pointer;
      color: #031018;
      background: linear-gradient(135deg, #3de0ff 0%, var(--neon) 40%, #0a8ec4 100%);
      box-shadow: 0 6px 22px rgba(0,212,255,0.25);
      transition: filter .15s, transform .12s, box-shadow .15s;
    }
    .btn-enter:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0,212,255,0.32);
    }
    .btn-enter:active { transform: translateY(0); }
    .btn-enter:disabled { opacity: 0.7; cursor: wait; transform: none; }

    .foot {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }
    .foot a {
      color: var(--neon);
      font-weight: 700;
    }
    .foot a:hover { text-decoration: underline; }
    .foot .sep { color: var(--muted-2); margin: 0 6px; }

    .back {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .15s;
    }
    .back:hover { color: var(--text); }

    @media (max-width: 480px) {
      .wrap { padding: 28px 16px 24px; }
      .card { padding: 26px 20px 22px; }
      input { font-size: 16px; min-height: 48px; }
      .btn-enter { min-height: 50px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <a class="brand" href="/" title="ProspecTHOR">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/thor-mask.png" alt="" width="26" height="26" />
      </span>
      <span class="brand-word">Prospec<span>THOR</span></span>
    </a>

    <div class="card">
      <div class="card-ico" aria-hidden="true">
        <!-- raio -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
        </svg>
      </div>
      <h1>Entrar</h1>
      <p class="sub">Acesse leads, pedidos e seu saldo de Trovoedas.</p>

      {% if error %}
      <div class="error" role="alert">{{ error }}</div>
      {% endif %}

      <form action="/entrar" method="POST" id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">Usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Seu usuário"
            required
            autocomplete="username"
            autofocus
            spellcheck="false"
          />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Sua senha"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn-enter" id="btn-login">Entrar no painel →</button>
      </form>

      <div class="foot">
        Não tem conta? <a href="/register">Criar grátis</a>
        <span class="sep">·</span>
        <a href="/" style="color:var(--muted);font-weight:600;">Site</a>
      </div>
    </div>

    <a class="back" href="/">← Voltar ao site</a>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function () {
      var btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
    });
  </script>
</body>
</html>
