<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — ProspecTHOR</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05070b; --card: #0c111a; --border: #1a2233;
      --text: #e8eef7; --muted: #8b9bb4; --neon: #00d4ff; --danger: #ff4d6a;
      --gold: #f5c542; --font: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; font-family: var(--font); color: var(--text);
      background:
        radial-gradient(ellipse 50% 40% at 80% 10%, rgba(245,197,66,0.1), transparent 50%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(0,212,255,0.1), transparent 50%),
        var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; padding: 28px 26px;
      border-radius: 18px; border: 1px solid var(--border); background: var(--card);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 18px; font-weight: 900; letter-spacing: -0.03em;
      color: var(--text); text-decoration: none; font-size: 15px;
    }
    .brand span { color: var(--neon); }
    /* PNG = máscara preta transparente → tile neon (igual login/landing) */
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
      background: linear-gradient(145deg, #00d4ff 0%, #0a6fa8 100%);
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px rgba(0,212,255,0.25), 0 0 18px rgba(0,212,255,0.28), inset 0 1px 0 rgba(255,255,255,0.28);
      overflow: hidden;
    }
    .brand-mark img {
      width: 24px; height: 24px;
      display: block;
      object-fit: contain;
    }
    h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 6px; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.45; }
    .bonus {
      font-size: 12px; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px;
      background: rgba(245,197,66,0.1); border: 1px solid rgba(245,197,66,0.3); color: #ffe8a3;
    }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: #080b12; color: var(--text);
      font-size: 14px; outline: none;
    }
    input:focus { border-color: rgba(0,212,255,0.45); }
    .terms {
      display: flex; gap: 10px; align-items: flex-start; margin: 16px 0;
      font-size: 12px; color: var(--muted); line-height: 1.4;
    }
    .terms input { width: auto; margin-top: 2px; }
    .terms a { color: var(--neon); }
    .btn {
      width: 100%; margin-top: 8px; padding: 12px; border: none; border-radius: 12px;
      font-weight: 800; font-size: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--neon), #0a8ec4); color: #031018;
    }
    .err {
      background: rgba(255,77,106,0.12); border: 1px solid rgba(255,77,106,0.35);
      color: #ffb3c0; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px;
    }
    .foot { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
    .foot a { color: var(--neon); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/thor-mask.png" alt="" width="24" height="24" />
      </span>
      Prospec<span>THOR</span>
    </a>
    <h1>Criar conta</h1>
    <p class="sub">Leads com contato real. Pague só o que usar com Trovoedas.</p>
    <div class="bonus"><img src="/static/trovoeda-coin.svg?v=tilt2" alt="" width="18" height="18" style="vertical-align:-3px;margin-right:4px;" /> Bônus de boas-vindas: <strong>5 Trovoedas grátis</strong> pra testar (1 moeda = 1 lead).</div>

    {% if error %}
    <div class="err">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register" autocomplete="on">
      <label for="display_name">Nome</label>
      <input id="display_name" name="display_name" type="text" required maxlength="80"
             value="{{ form.display_name or '' }}" placeholder="Seu nome" />

      <label for="username">Usuário (login)</label>
      <input id="username" name="username" type="text" required maxlength="40" pattern="[a-zA-Z0-9_\.\-]+"
             value="{{ form.username or '' }}" placeholder="ex: joao_silva" />

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required maxlength="120"
             value="{{ form.email or '' }}" placeholder="voce@empresa.com" />

      <label for="whatsapp">WhatsApp</label>
      <input id="whatsapp" name="whatsapp" type="tel" required maxlength="20"
             value="{{ form.whatsapp or '' }}" placeholder="DDD + número" />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="128"
             placeholder="mín. 8 caracteres" />

      <label class="terms">
        <input type="checkbox" name="terms" value="1" required {% if form.terms %}checked{% endif %} />
        <span>Li e aceito os <a href="/termos" target="_blank">Termos de Uso</a> e a <a href="/privacidade" target="_blank">Política de Privacidade</a>.</span>
      </label>

      <button class="btn" type="submit">Criar conta e ganhar 5 Trovoedas</button>
    </form>
    <p class="foot">Já tem conta? <a href="/entrar">Entrar</a> · <a href="/">Voltar ao site</a></p>
  </div>
</body>
</html>
