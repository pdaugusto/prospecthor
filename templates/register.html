<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — ProspecTHOR</title>
  <meta name="description" content="Crie sua conta ProspecTHOR e ganhe 5 Trovoedas grátis." />
  <meta name="theme-color" content="#05070b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05070b;
      --border: #1a2233;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --muted-2: #5a6b82;
      --neon: #00d4ff;
      --gold: #f5c542;
      --danger: #ff4d6a;
      --font: Inter, system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 50% 40% at 50% 0%, rgba(0,212,255,0.1), transparent 55%),
        radial-gradient(ellipse 40% 30% at 80% 90%, rgba(245,197,66,0.07), transparent 50%),
        var(--bg);
    }
    .bg::after {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 25%, #000 15%, transparent 72%);
      opacity: 0.75;
    }

    .wrap {
      position: relative; z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 40px 20px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 24px;
    }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(145deg, #00d4ff 0%, #0a6fa8 100%);
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px rgba(0,212,255,0.28), 0 0 20px rgba(0,212,255,0.28), inset 0 1px 0 rgba(255,255,255,0.28);
      overflow: hidden;
    }
    .brand-mark img { width: 26px; height: 26px; display: block; object-fit: contain; }
    .brand-word {
      font-size: 16px; font-weight: 800; letter-spacing: -0.02em;
      color: #fff; white-space: nowrap; line-height: 1.2;
    }
    .brand-word span { color: var(--neon); text-shadow: 0 0 16px rgba(0,212,255,0.35); }

    .card {
      width: 100%;
      padding: 28px 26px 22px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(165deg, rgba(14,18,28,0.98), rgba(8,10,16,0.99));
      box-shadow: 0 24px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,212,255,0.04);
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 22px; right: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.6), transparent);
    }

    h1 {
      font-size: 22px; font-weight: 900; letter-spacing: -0.03em;
      margin-bottom: 6px; text-align: center;
    }
    .sub {
      font-size: 13px; color: var(--muted); line-height: 1.5;
      margin-bottom: 18px; text-align: center;
    }

    .bonus {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 12px; margin-bottom: 18px;
      background: rgba(245,197,66,0.1);
      border: 1px solid rgba(245,197,66,0.35);
      font-size: 12px; font-weight: 600; color: #ffe8a3; line-height: 1.4;
    }
    .bonus img { width: 22px; height: 22px; flex-shrink: 0; }
    .bonus strong { color: #fff; font-weight: 800; }

    .err {
      background: rgba(255,77,106,0.1);
      border: 1px solid rgba(255,77,106,0.35);
      color: #ffb3c0;
      padding: 11px 12px; border-radius: 11px;
      font-size: 13px; margin-bottom: 14px; line-height: 1.4;
    }

    .row-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    @media (max-width: 420px) {
      .row-2 { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted-2);
      margin: 12px 0 6px;
    }
    form > label:first-of-type { margin-top: 0; }
    .row-2 > div > label { margin-top: 12px; }
    .row-2 > div:first-child > label { margin-top: 12px; }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 12px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: #070b12;
      color: var(--text);
      font-size: 14px; font-family: var(--font); font-weight: 500;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--muted-2); font-weight: 400; }
    input:focus {
      border-color: rgba(0,212,255,0.5);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    .terms {
      display: flex; gap: 10px; align-items: flex-start;
      margin: 16px 0 8px;
      font-size: 12px; color: var(--muted); line-height: 1.45;
    }
    .terms input { width: auto; margin-top: 2px; accent-color: var(--neon); }
    .terms a { color: var(--neon); font-weight: 600; }

    .btn-create {
      width: 100%;
      margin-top: 10px;
      padding: 14px 16px;
      border: none; border-radius: 12px;
      font-weight: 800; font-size: 14px; font-family: var(--font);
      cursor: pointer;
      color: #031018;
      background: linear-gradient(135deg, #3de0ff 0%, var(--neon) 40%, #0a8ec4 100%);
      box-shadow: 0 6px 24px rgba(0,212,255,0.28);
      transition: filter .15s, transform .12s;
    }
    .btn-create:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-create:disabled { opacity: 0.7; cursor: wait; transform: none; }

    .micro {
      margin-top: 12px; text-align: center;
      font-size: 11px; color: var(--muted-2); line-height: 1.4;
    }
    .foot {
      margin-top: 18px; text-align: center;
      font-size: 13px; color: var(--muted);
    }
    .foot a { color: var(--neon); font-weight: 700; }
    .foot a:hover { text-decoration: underline; }
    .back {
      margin-top: 18px;
      font-size: 12px; font-weight: 600; color: var(--muted-2);
    }
    .back:hover { color: var(--text); }

    @media (max-width: 480px) {
      .wrap { padding: 28px 16px 28px; }
      .card { padding: 24px 18px 20px; }
      input { font-size: 16px; min-height: 46px; }
      .btn-create { min-height: 50px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <a class="brand" href="/" title="ProspecTHOR">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/thor-mask.png" alt="" width="26" height="26" />
      </span>
      <span class="brand-word">Prospec<span>THOR</span></span>
    </a>

    <div class="card">
      <h1>Criar conta</h1>
      <p class="sub">Menos de 1 minuto. Você já sai com bônus pra testar.</p>

      <div class="bonus">
        <img src="/static/trovoeda-coin.svg?v=tilt2" alt="" width="22" height="22" />
        <span>Bônus: <strong>5 Trovoedas grátis</strong> · 1 moeda = 1 lead · sem cartão</span>
      </div>

      {% if error %}
      <div class="err" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register" autocomplete="on" id="reg-form">
        <label for="display_name">Seu nome</label>
        <input id="display_name" name="display_name" type="text" required maxlength="80"
               value="{{ form.display_name or '' }}" placeholder="Como quer ser chamado" />

        <div class="row-2">
          <div>
            <label for="username">Usuário (login)</label>
            <input id="username" name="username" type="text" required maxlength="40" pattern="[a-zA-Z0-9_\.\-]+"
                   value="{{ form.username or '' }}" placeholder="ex: joao_silva" spellcheck="false" />
          </div>
          <div>
            <label for="whatsapp">WhatsApp</label>
            <input id="whatsapp" name="whatsapp" type="tel" required maxlength="20"
                   value="{{ form.whatsapp or '' }}" placeholder="DDD + número" />
          </div>
        </div>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="120"
               value="{{ form.email or '' }}" placeholder="voce@empresa.com" />

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required minlength="8" maxlength="128"
               placeholder="Mínimo 8 caracteres" autocomplete="new-password" />

        <label class="terms">
          <input type="checkbox" name="terms" value="1" required {% if form.terms %}checked{% endif %} />
          <span>Li e aceito os <a href="/termos" target="_blank" rel="noopener">Termos</a> e a <a href="/privacidade" target="_blank" rel="noopener">Privacidade</a>.</span>
        </label>

        <button class="btn-create" type="submit" id="btn-reg">Criar conta e ganhar 5 leads</button>
        <p class="micro">Sem cartão no cadastro · saldo não expira</p>
      </form>
    </div>

    <p class="foot">Já tem conta? <a href="/entrar">Entrar</a></p>
    <a class="back" href="/">← Voltar ao site</a>
  </div>

  <script>
    document.getElementById('reg-form').addEventListener('submit', function () {
      var btn = document.getElementById('btn-reg');
      if (btn) { btn.disabled = true; btn.textContent = 'Criando conta…'; }
    });
  </script>
</body>
</html>
